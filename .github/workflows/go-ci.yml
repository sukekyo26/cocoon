name: Go CI

on:
  # Topic branches are covered by pull_request, which also fires on every push
  # to an open PR (synchronize); a separate push trigger would run the suite
  # twice. develop pushes re-validate the integrated state: feature PRs may
  # have been gated against an older develop. main stays PR-only — the
  # develop->main release PR reruns the full suite. e2e / plugin-e2e skip
  # develop pushes (too heavy); only this lightweight go gate runs there.
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  schedule:
    # Mon 06:00 UTC — same window as the other weekly canaries. This one
    # exists for govulncheck: the vulnerability database moves on its own
    # schedule, so the Go patch pinned in go.mod goes stale with no commit to
    # trigger a run. Without this the first unrelated PR of the week is what
    # discovers it, and its author pays for a bump that is not theirs.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

# Cancel earlier in-progress runs on the same branch when a new push arrives.
# event_name is part of the key because the weekly run lands on the default
# branch, where release.yml's workflow_call also runs: without it the two
# would share a group and cancel each other, so a Monday release could lose
# its validation to a cron run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      # Installs the golangci-lint version pinned in the justfile.
      - run: just setup
      - run: just lint
      - run: just fmt-check

  test:
    name: Test (race + shuffle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just vet
      - run: just mod-verify
      - run: just test-race

  coverage:
    name: Coverage gate (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just cover-check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just vuln

  build:
    name: Cross-compile (linux/darwin x amd64/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just build-all
