name: Go CI

on:
  # Push fires for in-progress branches (pre-PR feedback) and for develop, so
  # a merge re-validates the integrated state: feature PRs may have been gated
  # against an older develop, and develop pushes would otherwise run no CI at
  # all. main stays PR-only — the develop->main release PR reruns the full
  # suite. e2e / plugin-e2e remain push-excluded (too heavy); only this
  # lightweight go gate runs on develop pushes.
  push:
    branches: ["feature/*", "fix/*", "refactor/*", develop]
  pull_request:
    branches: [develop, main]
  schedule:
    # Mon 06:00 UTC — same window as the other weekly canaries. This one
    # exists for govulncheck: the vulnerability database moves on its own
    # schedule, so the Go patch pinned in go.mod goes stale with no commit to
    # trigger a run. Without this the first unrelated PR of the week is what
    # discovers it, and its author pays for a bump that is not theirs.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

# Cancel earlier in-progress runs on the same branch when a new push arrives.
# event_name is part of the key because the weekly run lands on the default
# branch, where release.yml's workflow_call also runs: without it the two
# would share a group and cancel each other, so a Monday release could lose
# its validation to a cron run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # install.sh pinned to the golangci-lint v2.11.4 commit so the fetched
      # script is immutable; the script itself SHA256-verifies the binary.
      - name: Install golangci-lint v2.11.4
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/8f3b0c7ed018e57905fbd873c697e0b1ede605a5/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
      - run: just lint
      - run: just fmt-check

  test:
    name: Test (race + shuffle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just vet
      - run: just mod-verify
      - run: just test-race

  coverage:
    name: Coverage gate (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just cover-check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: just vuln

  build:
    name: Cross-compile (linux/darwin x amd64/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just build-all
