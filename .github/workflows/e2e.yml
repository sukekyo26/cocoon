name: E2E

# Real Docker round-trip on every push / PR: build the cocoon binary,
# init a fresh project, generate .devcontainer/, then `docker buildx
# bake` the image (via e2e/docker-roundtrip.sh, with GHA cache) and
# `docker compose up -d` + `exec` into the running container so
# generation drift breaks CI before it breaks users. Tear-down is
# handled by a `trap EXIT` inside the script. Plain `docker compose
# build` is intentionally not used — bake is what lets us inject the
# GHA cache backend without baking CI concerns into the generated
# docker-compose.yml.
#
# This workflow runs the lightweight half of the e2e coverage:
#   - preset = minimal (0 plugins)
#   - matrix axis = base image — every entry in
#     internal/config/schema.go's SupportedImages, each at the first
#     (default-recommended) tag from SupportedImageVersions.
#   - amd64 for all images + arm64 for ubuntu only (single arm64 job to
#     surface arm64-specific generator drift without exploding queue
#     time on the PR critical path).
#
# The heavier counterpart — per-plugin install-RUN builds — lives in
# .github/workflows/plugin-e2e.yml: it builds each changed plugin (amd64 +
# arm64, build-only) on a PR and the whole catalog on a weekly cron, with a
# single-plugin workflow_dispatch input for verifying a new plugin before
# merge. plugin-vs-image breakage is therefore caught at PR time for the
# changed plugin and weekly for the rest; plugin-vs-plugin coverage is
# dropped (init-time conflict validation catches most).
#
# Each leg also runs the build-free Trivy gates (`just trivy-static`) over the
# .devcontainer/ it generated: misconfiguration and secret findings fail the
# job, with the two intentional Dockerfile misconfigs justified in
# .trivyignore.yaml. Image CVEs are reported, never gated — they are upstream
# base-image issues, so they land in the job summary as a delta signal for
# SupportedImageVersions bumps instead of a red check. The plugin-side
# counterpart lives in plugin-e2e.yml: that workflow cannot run `trivy image`
# (its single preset forces BUILD_ONLY, so no image is ever loaded), but
# plugin install scripts are inlined verbatim into the Dockerfile, so the
# static gates cover every plugin there without a build.
#
# Local WSL2 cannot run these (gcc missing for `-race`); GitHub-hosted
# ubuntu-latest / ubuntu-24.04-arm both ship docker + buildx out of the
# box.

on:
  # Push fires for in-progress branches (pre-PR feedback). develop / main
  # are deliberately excluded so a merge does not double up with the
  # pull_request run that already gated it.
  push:
    branches: ["feature/*", "fix/*", "refactor/*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-roundtrip:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # scan-image marks the legs whose base image is distinct. The CVE
        # report is per base image, so the arm64 and sudo=* ubuntu legs below
        # would only re-report ubuntu 26.04 three more times.
        include:
          - label: amd64 / ubuntu
            runs-on: ubuntu-latest
            image: ubuntu
            image-version: "26.04"
            scan-image: true
          - label: amd64 / debian
            runs-on: ubuntu-latest
            image: debian
            image-version: "12"
            scan-image: true
          - label: amd64 / node
            runs-on: ubuntu-latest
            image: node
            image-version: "26-bookworm-slim"
            scan-image: true
          - label: amd64 / python
            runs-on: ubuntu-latest
            image: python
            image-version: "3.14-slim-bookworm"
            scan-image: true
          - label: amd64 / golang
            runs-on: ubuntu-latest
            image: golang
            image-version: "1.26-bookworm"
            scan-image: true
          - label: amd64 / rust
            runs-on: ubuntu-latest
            image: rust
            image-version: "1.96-bookworm"
            scan-image: true
          - label: amd64 / denoland/deno
            runs-on: ubuntu-latest
            image: denoland/deno
            image-version: "debian-2.8.2"
            scan-image: true
          - label: arm64 / ubuntu
            runs-on: ubuntu-24.04-arm
            image: ubuntu
            image-version: "26.04"
          # Extra ubuntu jobs exercise the non-default sudo postures end to
          # end (compose artifact + live kernel flag + sudo behaviour):
          #   none     -> no-new-privileges blocks escalation.
          #   password -> sudo needs the .env.local build secret; a missing
          #               one fails the build (no silent passwordless fallback),
          #               and the seeded password authenticates at runtime.
          # The other entries leave SUDO_MODE unset for the default posture, so
          # all three paths get a real Docker round-trip.
          - label: amd64 / ubuntu / sudo=none
            runs-on: ubuntu-latest
            image: ubuntu
            image-version: "26.04"
            sudo-mode: none
          - label: amd64 / ubuntu / sudo=password
            runs-on: ubuntu-latest
            image: ubuntu
            image-version: "26.04"
            sudo-mode: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL / ACTIONS_RESULTS_URL
      # as plain env vars so the raw `docker buildx bake` invocation in
      # the script below can talk to the GHA cache backend.
      # docker/build-push-action and docker/bake-action inject these
      # automatically; a hand-written shell step does not, so we surface
      # them explicitly here.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # trivy has no version pin of its own: install-action resolves an
      # omitted version from its own release, so the SHA above pins both.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: just,trivy
      - name: Build cocoon binary
        run: just build
      - name: cocoon init + gen + docker compose round-trip
        env:
          COCOON: ${{ github.workspace }}/bin/cocoon
          PRESET: minimal
          IMAGE: ${{ matrix.image }}
          IMAGE_VERSION: ${{ matrix.image-version }}
          SUDO_MODE: ${{ matrix.sudo-mode }}
        run: bash "$GITHUB_WORKSPACE/e2e/docker-roundtrip.sh"

      # Build-free Trivy gates on the tree `cocoon gen` just wrote. The script
      # above leaves e2e/test-project/ in place (its trap only runs `compose
      # down -v`), so this reads the exact artifact that was built, with no
      # second `cocoon gen` to drift from it.
      - name: Trivy misconfig + secret (gating)
        run: just trivy-static

      # Report-only: base image CVEs are upstream and unfixable in this repo.
      # The value is the delta a SupportedImageVersions bump shows in the job
      # summary. continue-on-error also absorbs operational failures (DB pull
      # rate limit, registry outage) instead of turning an informational scan
      # into a red check.
      - name: Trivy image CVE report
        if: matrix.scan-image
        continue-on-error: true
        run: |
          set -euo pipefail
          # Capture the whole list, then take the first line in the shell.
          # Piping into `head -1` would let head close the pipe on a
          # multi-service compose file, so compose dies on SIGPIPE and
          # pipefail fails the step for a reason that has nothing to do with
          # the scan.
          images="$(docker compose \
            --env-file e2e/test-project/.devcontainer/.env \
            -f e2e/test-project/.devcontainer/docker-compose.yml \
            config --images)"
          image="${images%%$'\n'*}"
          if [ -z "$image" ]; then
            echo "docker compose config --images produced no image name" >&2
            exit 1
          fi
          {
            echo "### Trivy image CVEs — ${{ matrix.label }} (\`${image}\`)"
            echo '```'
            just trivy-image "$image"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
